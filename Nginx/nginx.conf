events { worker_connections 1024; }

http {
    server {
        listen 80;

        # Forward important headers to the microservices
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # CRITICAL FIX: Route user orders to the Order Service
        # Matches /api/users/{any_id}/orders
        location ~ ^/api/users/[^/]+/orders {
            proxy_pass http://order-service:5003;
        }

        # Standard routes
        location /api/users {
            proxy_pass http://user-service:5001; 
        }

        location /api/products {
            proxy_pass http://product-service:5002;
        }

        location /api/orders {
            proxy_pass http://order-service:5003;
        }
    }
}