services:
  nginx:
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - ../Nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service

  user-service:
    build: 
      context: ../Services/user-service
    ports:
      - "5001:5001"

  product-service:
    build: 
      context: ../Services/product-service
    ports:
      - "5002:5002"

  order-service:
    build: 
      context: ../Services/order-service
    ports:
      - "5003:5003"
  
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"